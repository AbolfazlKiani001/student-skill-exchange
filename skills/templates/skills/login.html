
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ورود | تبادل مهارت دانشجویان</title>

  <link rel="stylesheet" href="https://unpkg.com/mdui@2/mdui.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <script src="https://unpkg.com/mdui@2/mdui.global.js"></script>

  <style>
    body { font-family: "Vazirmatn", Tahoma, sans-serif; margin: 0; background: rgb(var(--mdui-color-surface-container-low)); }
    .container { max-width: 560px; margin: 24px auto; padding: 0 16px; }
    .form-card { display: block; width: 100%; padding: 24px; box-sizing: border-box; }
    h1 { margin: 0 0 4px; font-size: 1.5rem; }
    p.sub { margin: 0 0 20px; color: rgb(var(--mdui-color-on-surface-variant)); font-size: .9rem; }
    form > * { margin-bottom: 16px; }
    mdui-text-field { width: 100%; }
    .remember { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .actions { display: flex; gap: 12px; margin-top: 8px; }
    .actions mdui-button { flex: 1; }
    .links { text-align: center; font-size: .9rem; }
    .links a { color: rgb(var(--mdui-color-primary)); text-decoration: none; }
    .error { color: #ba1a1a; margin-bottom: 16px; }
  </style>
</head>

<body>

  <mdui-top-app-bar>
    <mdui-top-app-bar-title>تبادل مهارت</mdui-top-app-bar-title>
    <div style="flex-grow:1"></div>
    <mdui-button variant="text" href="{% url 'skill_list' %}">کاتالوگ</mdui-button>
    <mdui-button variant="text" href="{% url 'about' %}">درباره ما</mdui-button>
    <mdui-button variant="text" href="{% url 'contact' %}">تماس با ما</mdui-button>
    <mdui-button variant="text" href="{% url 'register' %}">ثبت‌نام</mdui-button>
  </mdui-top-app-bar>

  <div class="container">

    <mdui-card variant="elevated" class="form-card">

      <h1>ورود به سامانه</h1>
      <p class="sub">برای مدیریت درخواست‌ها و جلسات خود وارد شوید.</p>

      {% if error %}
        <p class="error">{{ error }}</p>
      {% endif %}

      <form id="login-form" method="POST">
        {% csrf_token %}

        <mdui-text-field
          name="username"
          label="نام کاربری"
          required>
        </mdui-text-field>

        <mdui-text-field
          name="password"
          label="رمز عبور"
          type="password"
          toggle-password
          required>
        </mdui-text-field>

        <div class="actions">
          <mdui-button type="submit" variant="filled">
            ورود
          </mdui-button>
        </div>

        <div class="links">
          حساب ندارید؟
          <a href="{% url 'register' %}">ثبت‌نام کنید</a>
        </div>

      </form>

    </mdui-card>

  </div>

</body>
</html>
